<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoxEarn Admin - Adsgram Only</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a1a; color: white; }
        .admin { max-width: 800px; margin: 0 auto; padding: 20px; }
        .header { background: linear-gradient(135deg, #0088cc, #005577); padding: 20px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
        .tabs { display: flex; gap: 5px; margin-bottom: 15px; flex-wrap: wrap; }
        .tab-btn { padding: 10px 18px; border-radius: 20px; border: 1px solid #333; background: #1a1a2e; color: white; cursor: pointer; }
        .tab-btn.active { background: #0088cc; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .section { background: #1a1a2e; border-radius: 15px; padding: 20px; margin-bottom: 15px; border: 1px solid #2a2a4a; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; color: #888; margin-bottom: 5px; text-transform: uppercase; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; background: #0d0d20; border: 1px solid #333; border-radius: 8px; color: white; }
        .btn { padding: 12px 20px; border-radius: 25px; border: none; font-weight: bold; cursor: pointer; color: white; background: #0088cc; }
        .btn-green { background: #4caf50; }
        .btn-red { background: #f44336; }
        .row { display: flex; gap: 10px; flex-wrap: wrap; }
        .col { flex: 1; }
        .card-item { background: #0d0d20; border-radius: 10px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .badge { padding: 4px 10px; border-radius: 10px; font-size: 11px; display: inline-block; margin: 2px; }
        .badge-blue { background: #0088cc20; color: #0088cc; }
        .badge-orange { background: #f7931a20; color: #f7931a; }
        .toast { position: fixed; top: 20px; right: 20px; background: #1a1a2e; border-left: 4px solid #0088cc; padding: 15px; border-radius: 8px; z-index: 1000; }
    </style>
</head>
<body>
<div class="admin">
    <div class="header"><h1>🦊 FoxEarn Admin</h1><p>Adsgram Only - Multiple Ad Tasks</p></div>
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('mining')">⛏️ Mining</button>
        <button class="tab-btn" onclick="switchTab('plans')">📋 Plans</button>
        <button class="tab-btn" onclick="switchTab('tasks')">📝 Tasks</button>
        <button class="tab-btn" onclick="switchTab('ads')">📺 Ads</button>
        <button class="tab-btn" onclick="switchTab('withdrawals')">💸 Payouts</button>
        <button class="tab-btn" onclick="switchTab('referral')">👥 Referral</button>
    </div>

    <!-- Mining -->
    <div class="tab-content active" id="tab-mining">
        <div class="section">
            <h2>⛏️ Mining Config</h2>
            <div class="row">
                <div class="col"><div class="form-group"><label>Mining Speed (TON/Hash/24h)</label><input type="number" id="miningSpeed" value="0.0001" step="0.0001"></div></div>
                <div class="col"><div class="form-group"><label>TON Price (USD)</label><input type="number" id="tonPrice" value="5.20" step="0.01"></div></div>
            </div>
            <div class="row">
                <div class="col"><div class="form-group"><label>Min Withdraw (TON)</label><input type="number" id="minWithdraw" value="0.5" step="0.1"></div></div>
                <div class="col"><div class="form-group"><label>Ad Reward (TON/ad)</label><input type="number" id="adReward" value="0.01" step="0.0001"></div></div>
            </div>
            <div class="form-group"><label>💎 Deposit Wallet</label><input type="text" id="depositAddress" placeholder="UQD..."></div>
            <button class="btn" onclick="saveMiningSettings()">💾 Save</button>
        </div>
    </div>

    <!-- Plans -->
    <div class="tab-content" id="tab-plans">
        <div class="section">
            <h2>📋 Mining Plans</h2>
            <div id="adminPlansList"></div>
            <div class="section" style="border:2px solid #0088cc;">
                <h3>➕ Add Plan</h3>
                <div class="row">
                    <div class="col"><input type="text" id="newPlanName" placeholder="Name"></div>
                    <div class="col"><input type="number" id="newPlanPrice" placeholder="Price TON"></div>
                </div>
                <div class="row">
                    <div class="col"><input type="number" id="newPlanHashrate" placeholder="Hashrate H/s"></div>
                    <div class="col"><input type="text" id="newPlanIcon" placeholder="Icon emoji" value="💎"></div>
                </div>
                <button class="btn btn-green" onclick="addNewPlan()">➕ Add Plan</button>
            </div>
        </div>
    </div>

    <!-- TASKS - Adsgram only -->
    <div class="tab-content" id="tab-tasks">
        <div class="section">
            <h2>📝 Tasks (TON + Hashrate Rewards)</h2>
            <div id="adminTasksList"></div>
            <div class="section" style="border:2px solid #0088cc;">
                <h3>➕ Add New Task</h3>
                <div class="form-group"><label>Task Title</label><input type="text" id="newTaskTitle" placeholder="e.g., Watch Ad - Bonus"></div>
                <div class="form-group"><label>Description</label><input type="text" id="newTaskDesc" placeholder="Watch a short ad"></div>
                <div class="checkbox-group">
                    <input type="checkbox" id="newTaskIsAd" checked onchange="toggleAdFields()">
                    <label>📺 This is a Watch Ad task (Adsgram)</label>
                </div>
                <div id="adFields">
                    <div class="form-group"><label>Adsgram Block ID</label><input type="text" id="newTaskAdUnitId" placeholder="e.g., 29232"></div>
                </div>
                <div class="row">
                    <div class="col"><div class="form-group"><label>💰 TON Reward</label><input type="number" id="newTaskRewardTon" value="0.01" step="0.001"></div></div>
                    <div class="col"><div class="form-group"><label>⚡ Hashrate Reward (H/s)</label><input type="number" id="newTaskRewardHash" value="0" step="1"></div></div>
                </div>
                <div class="row">
                    <div class="col"><div class="form-group"><label>Icon (emoji)</label><input type="text" id="newTaskIcon" value="📺"></div></div>
                    <div class="col"><div class="form-group"><label>Link (optional)</label><input type="text" id="newTaskLink" placeholder="https://..."></div></div>
                </div>
                <button class="btn btn-green" onclick="addNewTask()">➕ Add Task</button>
                <p style="font-size:11px; margin-top:10px;">💡 Each ad task can have its own Block ID and reward. Users watch Adsgram ad to earn.</p>
            </div>
        </div>
    </div>

    <!-- Ads Settings (global cooldown, fallback block ID) -->
    <div class="tab-content" id="tab-ads">
        <div class="section">
            <h2>📺 Adsgram Settings</h2>
            <div class="form-group"><label>Ad Cooldown (seconds)</label><input type="number" id="adCooldown" value="60"></div>
            <div class="form-group"><label>Fallback Block ID (if task has none)</label><input type="text" id="adsgramBlockId" placeholder="e.g., 29232"></div>
            <button class="btn" onclick="saveAdSettings()">💾 Save</button>
        </div>
    </div>

    <!-- Withdrawals -->
    <div class="tab-content" id="tab-withdrawals">
        <div class="section"><h2>💸 Pending Withdrawals</h2><div id="withdrawalsList">Loading...</div></div>
    </div>

    <!-- Referral -->
    <div class="tab-content" id="tab-referral">
        <div class="section"><h2>👥 Referral</h2><div class="form-group"><label>Commission (%)</label><input type="number" id="referralPercent" value="10"></div><button class="btn" onclick="saveReferralSettings()">💾 Save</button></div>
    </div>
</div>
<div id="toastContainer"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDldvyBpQK95cyvzE267boV5HfOLJLTn2Q",
        authDomain: "foxiearn.firebaseapp.com",
        projectId: "foxiearn",
        storageBucket: "foxiearn.firebasestorage.app",
        messagingSenderId: "677808159330",
        appId: "1:677808159330:web:db53698d8eab0a9cd5ef3b"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    let SETTINGS = {};

    function loadSettings() {
        db.collection('settings').doc('global').get().then(doc => {
            if (doc.exists) SETTINGS = doc.data();
            else {
                SETTINGS = {
                    miningSpeed: 0.0001, tonPrice: 5.20, adReward: 0.01, minWithdraw: 0.5, referralPercent: 10, adCooldown: 60,
                    depositAddress: 'UQD...', adsgramBlockId: '29232',
                    plans: [
                        { id:'p1', name:'🥉 Starter', price:2, hashrate:50, daily:'0.005 TON', icon:'🥉' },
                        { id:'p2', name:'🥈 Pro', price:10, hashrate:500, daily:'0.05 TON', icon:'🥈' },
                        { id:'p3', name:'🥇 Max', price:50, hashrate:5000, daily:'0.5 TON', icon:'🥇' }
                    ],
                    tasks: [
                        { id:'t1', title:'📺 Watch Ad 1', desc:'Watch short ad', rewardTon:0.01, rewardHash:0, icon:'📺', link:'', isAdTask:true, adNetwork:'adsgram', adUnitId:'29232' },
                        { id:'t2', title:'📺 Watch Ad 2', desc:'Another ad', rewardTon:0.015, rewardHash:2, icon:'📺', link:'', isAdTask:true, adNetwork:'adsgram', adUnitId:'29233' },
                        { id:'t3', title:'📺 Watch Ad 3', desc:'Bonus ad', rewardTon:0.02, rewardHash:5, icon:'📺', link:'', isAdTask:true, adNetwork:'adsgram', adUnitId:'29234' }
                    ]
                };
                db.collection('settings').doc('global').set(SETTINGS);
            }
            loadFormValues();
            renderAll();
        });
    }

    function saveSettingsToCloud() { db.collection('settings').doc('global').set(SETTINGS, {merge:true}).then(()=>showToast('Saved')).catch(e=>showToast('Error')); }
    function showToast(msg) { let t=document.createElement('div'); t.className='toast'; t.innerText=msg; document.getElementById('toastContainer').appendChild(t); setTimeout(()=>t.remove(),2000); }
    function switchTab(name) { document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active')); document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active')); document.getElementById('tab-'+name).classList.add('active'); if(event?.target) event.target.classList.add('active'); if(name==='plans') renderAdminPlans(); if(name==='tasks') renderAdminTasks(); if(name==='withdrawals') renderWithdrawals(); }
    function loadFormValues() { 
        if(SETTINGS.miningSpeed) document.getElementById('miningSpeed').value=SETTINGS.miningSpeed;
        if(SETTINGS.tonPrice) document.getElementById('tonPrice').value=SETTINGS.tonPrice;
        if(SETTINGS.adReward) document.getElementById('adReward').value=SETTINGS.adReward;
        if(SETTINGS.minWithdraw) document.getElementById('minWithdraw').value=SETTINGS.minWithdraw;
        if(SETTINGS.referralPercent) document.getElementById('referralPercent').value=SETTINGS.referralPercent;
        if(SETTINGS.adCooldown) document.getElementById('adCooldown').value=SETTINGS.adCooldown;
        if(SETTINGS.depositAddress) document.getElementById('depositAddress').value=SETTINGS.depositAddress;
        if(SETTINGS.adsgramBlockId) document.getElementById('adsgramBlockId').value=SETTINGS.adsgramBlockId;
    }
    function saveMiningSettings() { SETTINGS.miningSpeed=parseFloat(document.getElementById('miningSpeed').value); SETTINGS.tonPrice=parseFloat(document.getElementById('tonPrice').value); SETTINGS.adReward=parseFloat(document.getElementById('adReward').value); SETTINGS.minWithdraw=parseFloat(document.getElementById('minWithdraw').value); SETTINGS.depositAddress=document.getElementById('depositAddress').value; saveSettingsToCloud(); }
    function renderAdminPlans() { let c=document.getElementById('adminPlansList'); if(!SETTINGS.plans?.length) { c.innerHTML='<p>No plans</p>'; return; } c.innerHTML=SETTINGS.plans.map((p,i)=>`<div class="card-item"><div><b>${p.icon} ${p.name}</b><br>⚡${p.hashrate} H/s | 💰${p.price} TON</div><button class="btn btn-red" onclick="deletePlan(${i})">🗑</button></div>`).join(''); }
    function addNewPlan() { let name=document.getElementById('newPlanName').value; let price=parseFloat(document.getElementById('newPlanPrice').value); let hashrate=parseInt(document.getElementById('newPlanHashrate').value); let icon=document.getElementById('newPlanIcon').value; if(!name||!price) return; let daily=(hashrate*SETTINGS.miningSpeed).toFixed(7)+' TON'; SETTINGS.plans.push({id:'p'+Date.now(), name:icon+' '+name, price, hashrate, daily, icon}); saveSettingsToCloud(); renderAdminPlans(); }
    function deletePlan(i) { if(confirm('Delete?')){ SETTINGS.plans.splice(i,1); saveSettingsToCloud(); renderAdminPlans(); } }
    function toggleAdFields() { let isAd=document.getElementById('newTaskIsAd').checked; document.getElementById('adFields').style.display=isAd?'block':'none'; if(isAd) document.getElementById('newTaskIcon').value='📺'; else document.getElementById('newTaskIcon').value='📋'; }
    function renderAdminTasks() { let c=document.getElementById('adminTasksList'); if(!SETTINGS.tasks?.length) { c.innerHTML='<p>No tasks</p>'; return; } c.innerHTML=SETTINGS.tasks.map((t,i)=>`<div class="card-item"><div><b>${t.icon} ${t.title}</b><br>💰${t.rewardTon} TON / ⚡${t.rewardHash} H/s ${t.isAdTask?`| Block ID: ${t.adUnitId}`:''}</div><button class="btn btn-red" onclick="deleteTask(${i})">🗑</button></div>`).join(''); }
    function addNewTask() { let title=document.getElementById('newTaskTitle').value; let desc=document.getElementById('newTaskDesc').value; let rewardTon=parseFloat(document.getElementById('newTaskRewardTon').value)||0; let rewardHash=parseInt(document.getElementById('newTaskRewardHash').value)||0; let icon=document.getElementById('newTaskIcon').value; let link=document.getElementById('newTaskLink').value; let isAd=document.getElementById('newTaskIsAd').checked; let adUnitId=isAd?document.getElementById('newTaskAdUnitId').value:null; if(!title) return showToast('Title required'); if(isAd && !adUnitId) return showToast('Block ID required'); SETTINGS.tasks.push({id:'t'+Date.now(), title, desc, rewardTon, rewardHash, icon, link, isAdTask:isAd, adNetwork:'adsgram', adUnitId}); saveSettingsToCloud(); renderAdminTasks(); document.getElementById('newTaskTitle').value=''; document.getElementById('newTaskDesc').value=''; }
    function deleteTask(i) { if(confirm('Delete?')){ SETTINGS.tasks.splice(i,1); saveSettingsToCloud(); renderAdminTasks(); } }
    function saveAdSettings() { SETTINGS.adCooldown=parseInt(document.getElementById('adCooldown').value); SETTINGS.adsgramBlockId=document.getElementById('adsgramBlockId').value; saveSettingsToCloud(); }
    function renderWithdrawals() { let c=document.getElementById('withdrawalsList'); db.collection('users').get().then(snapshot=>{ let pending=[]; snapshot.forEach(doc=>{ let txs=doc.data().transactions||[]; txs.forEach(tx=>{ if(tx.type==='withdraw' && tx.status==='pending') pending.push({userId:doc.id,...tx}); }); }); if(pending.length===0) { c.innerHTML='<p>No pending</p>'; return; } c.innerHTML=pending.map(tx=>`<div class="card-item"><div>💰${tx.amount} TON<br>${tx.address}</div><div><button class="btn btn-green" onclick="approveWithdraw('${tx.userId}','${tx.date}')">✅</button><button class="btn btn-red" onclick="rejectWithdraw('${tx.userId}','${tx.date}')">❌</button></div></div>`).join(''); }); }
    function approveWithdraw(userId,date){ db.collection('users').doc(userId).get().then(doc=>{ let user=doc.data(); let tx=user.transactions.find(t=>t.date===date); if(tx){ tx.status='approved'; db.collection('users').doc(userId).update({transactions:user.transactions}); showToast('Approved'); renderWithdrawals(); } }); }
    function rejectWithdraw(userId,date){ db.collection('users').doc(userId).get().then(doc=>{ let user=doc.data(); let tx=user.transactions.find(t=>t.date===date); if(tx){ tx.status='rejected'; user.tonBalance+=tx.amount; db.collection('users').doc(userId).update({transactions:user.transactions, tonBalance:user.tonBalance}); showToast('Rejected, refunded'); renderWithdrawals(); } }); }
    function saveReferralSettings() { SETTINGS.referralPercent=parseInt(document.getElementById('referralPercent').value); saveSettingsToCloud(); }
    function renderAll() { renderAdminPlans(); renderAdminTasks(); }
    loadSettings();
    window.toggleAdFields = toggleAdFields;
    window.switchTab = switchTab;
    window.saveMiningSettings = saveMiningSettings;
    window.addNewPlan = addNewPlan;
    window.deletePlan = deletePlan;
    window.addNewTask = addNewTask;
    window.deleteTask = deleteTask;
    window.saveAdSettings = saveAdSettings;
    window.approveWithdraw = approveWithdraw;
    window.rejectWithdraw = rejectWithdraw;
    window.saveReferralSettings = saveReferralSettings;
</script>
</body>
</html>
