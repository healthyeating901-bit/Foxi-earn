<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>FoxEarn - Earn TON</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a1a; color: white; padding: 16px; }
        .container { max-width: 500px; margin: 0 auto; }
        .card { background: #1a1a2e; border-radius: 20px; padding: 16px; margin-bottom: 12px; border: 1px solid #2a2a4a; }
        .task-title { font-size: 18px; font-weight: bold; display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
        .task-desc { font-size: 13px; color: #aaa; margin-bottom: 10px; }
        .rewards { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
        .reward-badge { background: #0d0d20; padding: 4px 10px; border-radius: 20px; font-size: 12px; }
        .ton-badge { color: #4caf50; }
        .hash-badge { color: #f7931a; }
        .task-link { display: block; background: #0088cc; color: white; text-decoration: none; padding: 10px; border-radius: 30px; font-size: 14px; font-weight: bold; text-align: center; cursor: pointer; border: none; width: 100%; }
        .task-link.completed { background: #2a2a4a; opacity: 0.6; cursor: not-allowed; }
        .toast { position: fixed; bottom: 20px; left: 20px; right: 20px; background: #1e1e2e; border-left: 4px solid #0088cc; padding: 12px; border-radius: 12px; text-align: center; z-index: 1000; display: none; }
        .loading { text-align: center; margin-top: 50px; }
        .balance-bar { background: #0d0d20; border-radius: 30px; padding: 10px 16px; margin-bottom: 20px; display: flex; justify-content: space-between; font-size: 14px; }
    </style>
</head>
<body>
<div class="container">
    <div id="balanceBar" class="balance-bar">Loading...</div>
    <div id="tasksList">Loading tasks...</div>
</div>
<div id="toast" class="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://adsgram.ai/js/adsgram.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDldvyBpQK95cyvzE267boV5HfOLJLTn2Q",
        authDomain: "foxiearn.firebaseapp.com",
        projectId: "foxiearn",
        storageBucket: "foxiearn.firebasestorage.app",
        messagingSenderId: "677808159330",
        appId: "1:677808159330:web:db53698d8eab0a9cd5ef3b"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let tg = window.Telegram?.WebApp || { initDataUnsafe: { user: { id: 123456 } } };
    let userId = tg.initDataUnsafe?.user?.id || 'demo_' + Date.now();
    let settings = null;
    let userData = null;

    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.style.display = 'block';
        toast.style.borderLeftColor = isError ? '#f44336' : '#0088cc';
        setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    async function loadUser() {
        const doc = await db.collection('users').doc(userId.toString()).get();
        if (doc.exists) {
            userData = doc.data();
        } else {
            userData = { tonBalance: 0, hashrate: 0, completedTasks: [], lastAdTime: 0, transactions: [] };
            await db.collection('users').doc(userId.toString()).set(userData);
        }
    }

    async function loadSettings() {
        const doc = await db.collection('settings').doc('global').get();
        if (doc.exists) settings = doc.data();
        else settings = { tasks: [], adCooldown: 60, adsgramBlockId: '' };
    }

    async function saveUser() {
        await db.collection('users').doc(userId.toString()).update(userData);
    }

    async function grantReward(task) {
        let updated = false;
        if (task.rewardTon > 0) {
            userData.tonBalance += task.rewardTon;
            userData.transactions.push({ type: 'task', amount: task.rewardTon, taskTitle: task.title, date: new Date().toISOString(), status: 'completed' });
            updated = true;
        }
        if (task.rewardHash > 0) {
            userData.hashrate += task.rewardHash;
            updated = true;
        }
        if (updated) {
            await saveUser();
            showToast(`✅ Earned ${task.rewardTon>0?task.rewardTon+' TON ':''}${task.rewardHash>0?task.rewardHash+' H/s':''}!`);
            renderUI();
        }
    }

    async function completeTask(taskId) {
        if (userData.completedTasks.includes(taskId)) return;
        userData.completedTasks.push(taskId);
        await saveUser();
    }

    async function showAdsgramAd(blockId) {
        return new Promise((resolve, reject) => {
            if (!window.Adsgram) {
                reject(new Error("Adsgram SDK not loaded"));
                return;
            }
            const adController = window.Adsgram.init({ blockId: blockId, debug: false });
            adController.show().then(() => resolve()).catch(err => reject(err));
        });
    }

    async function handleAdTask(task) {
        let blockId = task.adUnitId || settings.adsgramBlockId;
        if (!blockId) {
            showToast("Ad not configured", true);
            return false;
        }
        // cooldown check
        const now = Date.now() / 1000;
        if (userData.lastAdTime && (now - userData.lastAdTime) < (settings.adCooldown || 60)) {
            const wait = Math.ceil((settings.adCooldown || 60) - (now - userData.lastAdTime));
            showToast(`Please wait ${wait} seconds`, true);
            return false;
        }
        try {
            await showAdsgramAd(blockId);
            userData.lastAdTime = now;
            await saveUser();
            return true;
        } catch (err) {
            console.error(err);
            showToast("Ad failed or was skipped", true);
            return false;
        }
    }

    async function onTaskClick(task) {
        if (userData.completedTasks.includes(task.id)) {
            showToast("Task already done");
            return;
        }
        if (task.isAdTask) {
            const success = await handleAdTask(task);
            if (!success) return;
        } else if (task.link) {
            window.open(task.link, '_blank');
            if (!confirm("After completing the action, click OK to claim reward.")) return;
        }
        await grantReward(task);
        await completeTask(task.id);
    }

    async function renderUI() {
        if (!settings || !userData) return;
        const tasks = settings.tasks || [];
        const container = document.getElementById('tasksList');
        const balanceDiv = document.getElementById('balanceBar');
        balanceDiv.innerHTML = `💰 ${userData.tonBalance.toFixed(4)} TON &nbsp;|&nbsp; ⚡ ${userData.hashrate} H/s`;

        if (tasks.length === 0) {
            container.innerHTML = '<div class="card">No tasks yet</div>';
            return;
        }

        let html = '';
        for (const task of tasks) {
            const isCompleted = userData.completedTasks.includes(task.id);
            let rewardsHtml = '';
            if (task.rewardTon > 0) rewardsHtml += `<span class="reward-badge ton-badge">💰 +${task.rewardTon} TON</span>`;
            if (task.rewardHash > 0) rewardsHtml += `<span class="reward-badge hash-badge">⚡ +${task.rewardHash} H/s</span>`;
            if (task.isAdTask) rewardsHtml += `<span class="reward-badge">📺 Adsgram</span>`;

            html += `
                <div class="card">
                    <div class="task-title"><span>${task.icon || '📋'}</span> ${task.title}</div>
                    <div class="task-desc">${task.desc || ''}</div>
                    <div class="rewards">${rewardsHtml}</div>
                    <button class="task-link ${isCompleted ? 'completed' : ''}" onclick='onTaskClickProxy(${JSON.stringify(task)})' ${isCompleted ? 'disabled' : ''}>
                        ${isCompleted ? '✅ Completed' : (task.isAdTask ? '📺 Watch Ad' : '🚀 Start')}
                    </button>
                </div>
            `;
        }
        container.innerHTML = html;
    }

    window.onTaskClickProxy = onTaskClick;

    async function init() {
        await loadSettings();
        await loadUser();
        await renderUI();
    }
    init();
</script>
</body>
</html>
